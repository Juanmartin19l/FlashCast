<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlashCast</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='flashcast.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
  <div class="container">
    <header>
      <div class="logo">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M13 10V3L4 14h7v7l9-11h-7z" fill="currentColor" />
        </svg>
      </div>
      <h1>FlashCast</h1>
      <p class="subtitle">Sistema de notificaciones en red local</p>
      <button id="btnEditar" class="btn-editar" title="Editar máquinas">⚙ Editar máquinas</button>
    </header>

    <div class="content">
      <div class="mensaje-section">
        <div class="section-header">
          <h2>Mensaje a enviar</h2>
        </div>
        <textarea id="mensaje" placeholder="Escribe aquí el mensaje que deseas enviar a todos los equipos..."># Notificación Importante

      ## Mensaje de la gerencia

      Esto es un mensaje de **ejemplo** con **negritas**.

      El sistema soporta:
      - # para encabezados principales
      - ## para encabezados secundarios
      - ** ** para **texto en negrita**

      Personaliza este mensaje según tus necesidades.</textarea>

        <div class="adjuntar-section">
          <label for="archivo" class="adjuntar-label">
            <span class="icon-clip">📎</span> Adjuntar archivo
            <span id="archivo-nombre" class="archivo-nombre">Ningún archivo seleccionado</span>
          </label>
          <input type="file" id="archivo" name="archivo" style="display:none;">
        </div>

        <div class="btn-group">
          <button id="btnEnviar" class="btn-enviar">
            Enviar a toda la red
          </button>

          <button id="btnCancelar" class="btn-cancelar" style="display: none;">
            Cancelar envío
          </button>
        </div>
      </div>

      <div class="log-section">
        <div class="log-header">
          <h2>Log de actividad</h2>
          <div class="log-stats">
            <div class="mini-stat">
              <span class="mini-label">Enviados</span>
              <span id="contador" class="mini-value">0</span>
            </div>
            <div class="mini-stat">
              <span class="mini-label">Historial</span>
              <span id="historial" class="mini-value">0</span>
            </div>
          </div>
        </div>
        <div id="log" class="log-container"></div>
      </div>
    </div>
  </div>

  <!-- Modal para editar máquinas -->
  <div id="modalEditar" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Editar máquinas</h2>
        <button class="modal-close" id="btnCerrarModal">&times;</button>
      </div>
      <div class="modal-body">
        <textarea id="jsonEditor" placeholder="Esperando cargar machines.json..."></textarea>
      </div>
      <div class="modal-footer">
        <button id="btnGuardar" class="btn-guardar">Guardar cambios</button>
        <button id="btnCancelarEdicion" class="btn-cancelar-modal">Cancelar</button>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>

</html>
