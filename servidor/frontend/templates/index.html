<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlashCast</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='flashcast.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
  <div class="container">
    <header>
      <div class="logo">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M13 10V3L4 14h7v7l9-11h-7z" fill="currentColor" />
        </svg>
      </div>
      <h1>FlashCast</h1>
      <p class="subtitle">Sistema de notificaciones en red local</p>
    </header>

    <div class="content">
      <div class="mensaje-section">
        <div class="section-header">
          <h2>Mensaje a enviar</h2>
          <p class="section-subtitle">Redacta el mensaje, selecciona el destino y envíalo en segundos.</p>
        </div>
        <textarea id="mensaje" placeholder="Ejemplo:
# Notificación importante
Recordatorio de reunión a las 10:30 en sala principal."></textarea>

        <div class="filtro-section">
          <label for="departamento" class="filtro-label">Departamento (opcional)</label>
          <select id="departamento">
            <option value="">Todos los departamentos</option>
          </select>
          <small class="filtro-help">Si lo completas, el mensaje se enviará solo a ese departamento.</small>
        </div>

        <div class="adjuntar-section">
          <label for="archivo" class="adjuntar-label">
            <span class="icon-clip">📎</span> Adjuntar archivo
            <span id="archivo-nombre" class="archivo-nombre">Ningún archivo seleccionado</span>
          </label>
          <button id="btnQuitarArchivo" type="button" class="btn-quitar-archivo" style="display: none;">Quitar
            archivo</button>
          <input type="file" id="archivo" name="archivo" style="display:none;">
        </div>

        <div class="btn-group">
          <button id="btnEnviar" class="btn-enviar">
            Enviar mensaje
          </button>

          <button id="btnCancelar" class="btn-cancelar" style="display: none;">
            Cancelar envío
          </button>
        </div>
      </div>

      <!-- Log de actividad eliminado -->
    </div>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>

</html>
